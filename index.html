'use strict';
function createBrowserAuth(persistent, tabStorage, seedAccounts, cryptoEngine) {
  const USER_KEY = 'playmate-html-accounts-v1';
  const SESSION_KEY = 'playmate-html-session-v1';
  const stateKey = id => 'playmate-html-state-v1:' + id;
  const publicAccount = user => ({ id: user.id, username: user.username, name: user.name, role: user.role });
  function read(store, key, fallback) { try { return JSON.parse(store.getItem(key) || 'null') ?? fallback; } catch { return fallback; } }
  function users() {
    const saved = read(persistent, USER_KEY, []);
    return [...seedAccounts, ...(Array.isArray(saved) ? saved : []).filter(user => user && ['player', 'owner'].includes(user.role) && !seedAccounts.some(seed => seed.username === user.username))];
  }
  function current() {
    const session = read(tabStorage, SESSION_KEY, null);
    if (!session || session.expires <= Date.now()) return null;
    const user = users().find(user => user.id === session.id);
    return user ? publicAccount(user) : null;
  }
  function begin(user) {
    tabStorage.setItem(SESSION_KEY, JSON.stringify({ id: user.id, expires: Date.now() + 28800000 }));
    return publicAccount(user);
  }
  function base64(buffer) { return btoa(String.fromCharCode(...new Uint8Array(buffer))); }
  async function hash(password, salt) {
    if (!cryptoEngine?.subtle) throw new Error('Open this file in a current Chrome, Edge or Firefox browser, or publish it on GitHub Pages.');
    const key = await cryptoEngine.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
    const result = await cryptoEngine.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: Uint8Array.from(atob(salt), character => character.charCodeAt(0)), iterations: 100000 }, key, 256);
    return base64(result);
  }

    const user = users().find(user => user.username === String(username).trim().toLowerCase());

    return begin(user);
  }
  async function register(input) {
    if (current()) throw new Error('Sign out before creating another account.');
    const username = String(input.username || '').trim().toLowerCase();
    const name = String(input.name || '').trim();
    const password = String(input.password || '');

    if (password.length < 8 || password.length > 128) throw new Error('Use a password of 8-128 characters.');
    if (name.length < 2 || name.length > 50 || !['player', 'owner'].includes(input.role)) throw new Error('Enter your name and choose an account type.');
    if (users().some(user => user.username === username)) throw new Error('That username is taken. Please choose another.');
    const salt = base64(cryptoEngine.getRandomValues(new Uint8Array(16)));
    const user = { id: cryptoEngine.randomUUID(), username, name, role: input.role, salt, hash: await hash(password, salt) };

    const user = current();

    return read(persistent, stateKey(user.id), null);
  }
  function saveState(role, value) {
    const user = current();

function safeStorage(storage) {
  const memory = new Map();
  return {
    getItem(key) { try { return storage?.getItem(key) ?? memory.get(key) ?? null; } catch { return memory.get(key) ?? null; } },
    setItem(key, value) { memory.set(key, String(value)); try { storage?.setItem(key, String(value)); } catch {} },
    removeItem(key) { memory.delete(key); try { storage?.removeItem(key); } catch {} }
  };
}

function baseBooking(court,date,time){if(date!==today)return null;const bookings={'c1-18:00':{name:'Evening five-a-side',person:'Youssef',paid:1200},'c1-19:00':{name:'Friday night football',person:'Youssef',paid:1200},'c2-17:00':{name:'The padel social',person:'Salma',paid:800},'c2-20:00':{name:'Friends doubles',person:'Nour',paid:800},'c3-18:00':{name:'Pickup basketball',person:'Kareem',paid:600},'c3-20:00':{name:'Evening hoops',person:'Hassan',paid:600}};return bookings[court+'-'+time]||null;}

ng><small>${s.type==='booked'?'Confirmed · EGP '+money(s.paid):s.type==='blocked'?'Click to reopen':'Click to block'}</small></button>`;}).join('')}`).join('')}</div></div></div><div class="panel"><div class="section-heading"><h2>Bookings for ${dayLabel(ownerDate).toLowerCase()}</h2><span class="count">${bookings.length} bookings</span></div><div class="calendar-wrap"><table class="booking-table"><thead><tr><th>GAME / CUSTOMER</th><th>COURT</th><th>TIME</th><th>AMOUNT</th><th>STATUS</th></tr></thead><tbody>${bookings.length?bookings.map(b=>`<tr><td><strong>${esc(b.name)}</strong></td><td>${esc(b.court.sport)}</td><td>${b.time}–${endTime(b.time)}</td><td>EGP ${money(b.paid)}</td><td><span class="status">Confirmed</span></td></tr>`).join(''):'<tr><td colspan="5">No bookings yet for this day. Add a booking or publish open slots.</td></tr>'}</tbody></table></div></div>`;

const dialog=document.getElementById('dialog');let lastFocus=null;
function openDialog(html){lastFocus=document.activeElement;dialog.innerHTML=html;if(!dialog.open){dialog.showModal();document.body.classList.add('modal-open');}else{dialog.scrollTop=0;dialog.querySelector('button,input,select')?.focus();}}
function closeDialog(){dialog.close();document.body.classList.remove('modal-open');lastFocus?.focus?.();}
dialog.addEventListener('cancel',()=>document.body.classList.remove('modal-open'));
dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDialog();}});
function closeBtn(){return `<button class="close-dialog" data-action="close" aria-label="Close dialog">${icon('close')}</button>`;}
function dialogHeader(title,subtitle=''){return `<div class="dialog-heading"><div><h2 id="dialog-title">${title}</h2>${subtitle?`<p class="dialog-subtitle" style="margin:9px 0 0">${subtitle}</p>`:''}</div>${closeBtn()}</div>`;}

let toastTimer;function toast(message){const el=document.getElementById('toast');el.textContent=message;el.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('visible'),3500);}

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action,id=el.dataset.id;e.preventDefault();

 if(a==='reset-filters'){ui.area='All Cairo';ui.sport='All sports';ui.day='any';ui.level='Any level';ui.budget=ui.view==='courts'?2000:500;ui.onlyOpen=false;render();return;}

async function checkSession(){
 try{const response=await browserApi('/api/auth/me',{cache:'no-store'});const data=await response.json();
  if(!response.ok||data.account.id!==account.id||data.account.role!==account.role)goToLogin();
 }catch{/* A temporary connection loss does not discard the current view. */}
}
window.addEventListener('pageshow',event=>{if(event.persisted)checkSession();});
window.addEventListener('focus',checkSession);
async function start(){
 try{
  const response=await browserApi('/api/'+account.role+'/state',{cache:'no-store'});
  if(response.status===401||response.status===403){goToLogin();return;}
  if(!response.ok)throw new Error('Could not load your account');
  const data=await response.json();state={...structuredClone(defaults),...data.state};
  state.profile={...defaults.profile,name:account.name,...data.state?.profile};render();
 }catch{
  document.getElementById('app').innerHTML='<main style="max-width:450px;margin:15vh auto;padding:25px"><h1>Could not load your account.</h1><p>Please check your connection and try again.</p><button class="btn btn-primary" onclick="window.location.reload()">Try again</button><button class="btn" data-action="logout">Sign out</button></main>';
 }
}
start();

let persistentStorage, sessionStorage;
try { persistentStorage = window.localStorage; } catch {}
try { sessionStorage = window.sessionStorage; } catch {}
const auth = createBrowserAuth(safeStorage(persistentStorage), safeStorage(sessionStorage), SEED_ACCOUNTS, window.crypto);
const root = document.getElementById('root');
let dashboardMounted = false;

function goToLogin() {
  auth.logout();
  window.location.hash = 'login';
  window.location.reload();
}

async function browserApi(path, options = {}) {
  let status = 200, data;
  const user = auth.current();
  if (path === '/api/auth/logout') { auth.logout(); data = { redirect: '#login' }; }
  else if (path === '/api/auth/me') { status = user ? 200 : 401; data = user ? { account: user } : { error: 'Please sign in to continue.' }; }
  else {
    const match = path.match(/^\/api\/(player|owner)\/state$/);
    if (!match) { status = 404; data = { error: 'Not found.' }; }
    else if (!user) { status = 401; data = { error: 'Please sign in to continue.' }; }
    else if (user.role !== match[1]) { status = 403; data = { error: 'This area is not available for your account type.' }; }
    else if (options.method === 'PUT') { auth.saveState(user.role, JSON.parse(options.body)); data = { saved: true }; }
    else { data = { state: auth.getState(user.role) }; }
  }
  return { status, ok: status >= 200 && status < 300, async json() { return structuredClone(data); } };
}

function showAuth(register = false) {
  document.body.className = 'auth-body';
  document.title = (register ? 'Create an account' : 'Sign in') + ' · Playmate';
  root.innerHTML = AUTH_VIEWS[register ? 'register' : 'login'];
  const form = document.getElementById('auth-form');
  const password = document.getElementById('password');
  const toggle = document.getElementById('password-toggle');
  const errorBox = document.getElementById('auth-error');
  toggle.addEventListener('click', () => {
    const show = password.type === 'password';
    password.type = show ? 'text' : 'password';
    toggle.textContent = show ? 'Hide' : 'Show';
    toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    toggle.setAttribute('aria-pressed', String(show));
  });
  form.addEventListener('submit', async event => {
    event.preventDefault();
    event.stopPropagation();
    if (!form.reportValidity()) return;
    const button = form.querySelector('[type="submit"]');
    const previous = button.innerHTML;
    errorBox.hidden = true;
    button.disabled = true;
    button.textContent = register ? 'Creating your account…' : 'Signing in…';
    try {
      const data = Object.fromEntries(new FormData(form));
      const user = register ? await auth.register(data) : await auth.login(data.username, data.password);
      password.value = '';
      window.location.hash = user.role === 'owner' ? 'venue' : 'player';
      openDashboard(user);
    } catch (error) {
      errorBox.textContent = error.message || 'Please try again.';
      errorBox.hidden = false;
      password.value = '';
      password.focus();
    } finally {
      button.disabled = false;
      button.innerHTML = previous;
    }
  });
}

function openDashboard(user) {
  if (dashboardMounted) return;
  dashboardMounted = true;
  document.body.className = '';
  root.innerHTML = DASHBOARD_VIEW;
  document.getElementById('app').dataset.account = JSON.stringify(user);
  mountDashboard();
}

window.addEventListener('hashchange', () => {
  const user = auth.current();
  if (dashboardMounted) {
    if (!user) { window.location.hash = 'login'; window.location.reload(); return; }
    const correct = user.role === 'owner' ? '#venue' : '#player';
    if (window.location.hash !== correct) window.history.replaceState(null, '', correct);
  } else if (user) openDashboard(user);
  else showAuth(window.location.hash === '#register');
});
const initialAccount = auth.current();
if (initialAccount) {
  window.history.replaceState(null, '', initialAccount.role === 'owner' ? '#venue' : '#player');
  openDashboard(initialAccount);
} else showAuth(window.location.hash === '#register');
